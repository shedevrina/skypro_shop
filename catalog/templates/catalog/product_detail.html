<!-- library/templates/library/books_detail.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Детали продукта</title>
    <!-- Подключение Bootstrap CSS -->
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">{{ product.name_product }}</h1>
        <p>Фотография: <img src="{{ product.photo.url }}" alt="{{ product.name_product }} {{ product.category.name_category }}"></p>
        <p>Описание: {{ product.description_product }} {{ product.category.name_category }}</p>
        <p>Цена продукта: {{ product.price_all|upper }}</p>
    </div>
    <!-- Подключение Bootstrap JS -->
    <script src="/static/js/bootstrap.bundle.min.js"></script>
</body>
</html>
